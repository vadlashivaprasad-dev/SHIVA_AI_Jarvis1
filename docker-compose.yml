
services:




  qdrant:
    image: qdrant/qdrant:latest
    container_name: shivaai-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT_API_KEY: "qdrant_dev_key"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shivaai-network


  ollama:
    image: ollama/ollama:latest
    container_name: shivaai-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - shivaai-network

  ollama-pull:
    image: ollama/ollama:latest
    container_name: shivaai-ollama-pull
    environment:
      OLLAMA_HOST: "http://ollama:11434"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-llama3.2:1b}"
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command: ['ollama pull "$${OLLAMA_MODEL}"']
    networks:
      - shivaai-network



  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: shivaai-gateway
    ports:
      - "8000:8000"
    environment:
      # Enforce zero-cost, self-hosted LLM usage.
      QDRANT_URL: "http://qdrant:6333"
      JWT_SECRET: "dev-secret-key-change-in-prod"
      DATABASE_PATH: "/var/lib/shivaai/gateway.db"

      # Ollama-only policy (gateway should refuse paid providers).
      LLM_PROVIDER: "ollama"
      LLM_TIMEOUT_SECONDS: "45"
      LLM_MAX_RETRIES: "3"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://ollama:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-llama3.2:1b}"

      # Keep keys unset/empty to prevent paid-provider usage.
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""

      LOG_LEVEL: "DEBUG"
      ENVIRONMENT: "development"
    depends_on:
      qdrant:
        condition: service_started
      ollama:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully

    volumes:
      - ./services/gateway:/app
      - gateway_data:/var/lib/shivaai

    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/ready').read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shivaai-network

  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: shivaai-frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: ""
      VITE_PROXY_TARGET: "http://gateway:8000"
      VITE_WS_URL: "ws://localhost:8000"
    depends_on:
      - gateway
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - shivaai-network

  grafana:
    image: grafana/grafana:latest
    container_name: shivaai-grafana
    ports:
      - "3001:3000"
    volumes:
      - ./infra/monitoring/grafana:/var/lib/grafana
    networks:
      - shivaai-network

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: shivaai-phoenix
    ports:
      - "6006:6006"
    networks:
      - shivaai-network

  # whisper (disabled by default; voice services can be enabled with ENABLE_WHISPER=true)
  # whisper:
  #   build:
  #     context: ./services/whisper
  #     dockerfile: Dockerfile
  #   container_name: shivaai-whisper
  #   ports:
  #     - "9001:9001"
  #   environment:
  #     ENABLE_WHISPER: "${ENABLE_WHISPER:-false}"
  #   networks:
  #     - shivaai-network

  # piper (disabled by default; voice services can be enabled with ENABLE_PIPER=true)
  # piper:
  #   build:
  #     context: ./services/piper
  #     dockerfile: Dockerfile
  #   container_name: shivaai-piper
  #   ports:
  #     - "9002:9002"
  #   environment:
  #     ENABLE_PIPER: "${ENABLE_PIPER:-false}"
  #   networks:
  #     - shivaai-network




  prometheus:
    image: prom/prometheus:latest
    container_name: shivaai-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - shivaai-network


volumes:
  qdrant_data:
  prometheus_data:
  ollama_data:
  gateway_data:



networks:
  shivaai-network:
    driver: bridge
