
services:




  qdrant:
    image: qdrant/qdrant:latest
    container_name: shivaai-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT_API_KEY: "qdrant_dev_key"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:6333/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shivaai-network


  ollama:
    image: ollama/ollama:latest
    container_name: shivaai-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - shivaai-network



  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: shivaai-gateway
    ports:
      - "8000:8000"
    environment:
      # Enforce zero-cost, self-hosted LLM usage.
      QDRANT_URL: "http://qdrant:6333"
      JWT_SECRET: "dev-secret-key-change-in-prod"
      DATABASE_PATH: "/app/data/gateway.db"

      # Ollama-only policy (gateway should refuse paid providers).
      LLM_PROVIDER: "ollama"
      LLM_TIMEOUT_SECONDS: "45"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://ollama:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-llama3}"

      # Keep keys unset/empty to prevent paid-provider usage.
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""

      LOG_LEVEL: "DEBUG"
      ENVIRONMENT: "development"
    depends_on:
      - qdrant

    volumes:
      - ./services/gateway:/app

    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: >
        CMD-SHELL
        python - <<'PY'
        import urllib.request
        urllib.request.urlopen('http://localhost:8000/health').read()
        PY
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shivaai-network

  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: shivaai-frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: "http://localhost:8000"
      VITE_WS_URL: "ws://localhost:8000"
    depends_on:
      - gateway
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - shivaai-network

  grafana:
    image: grafana/grafana:latest
    container_name: shivaai-grafana
    ports:
      - "3001:3000"
    volumes:
      - ./infra/monitoring/grafana:/var/lib/grafana
    networks:
      - shivaai-network

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: shivaai-phoenix
    ports:
      - "6006:6006"
    networks:
      - shivaai-network

  # whisper (disabled by default; voice services can be enabled with ENABLE_WHISPER=true)
  # whisper:
  #   build:
  #     context: ./services/whisper
  #     dockerfile: Dockerfile
  #   container_name: shivaai-whisper
  #   ports:
  #     - "9001:9001"
  #   environment:
  #     ENABLE_WHISPER: "${ENABLE_WHISPER:-false}"
  #   networks:
  #     - shivaai-network

  # piper (disabled by default; voice services can be enabled with ENABLE_PIPER=true)
  # piper:
  #   build:
  #     context: ./services/piper
  #     dockerfile: Dockerfile
  #   container_name: shivaai-piper
  #   ports:
  #     - "9002:9002"
  #   environment:
  #     ENABLE_PIPER: "${ENABLE_PIPER:-false}"
  #   networks:
  #     - shivaai-network




  prometheus:
    image: prom/prometheus:latest
    container_name: shivaai-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - shivaai-network


volumes:
  qdrant_data:
  prometheus_data:
  ollama_data:



networks:
  shivaai-network:
    driver: bridge
