version: '3.9'

services:
  postgresql:
    image: postgres:15-alpine
    container_name: shivaai-postgres
    environment:
      POSTGRES_USER: shivaai
      POSTGRES_PASSWORD: shivaai_dev_pass
      POSTGRES_DB: shivaai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shivaai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shivaai-network

  redis:
    image: redis:7-alpine
    container_name: shivaai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shivaai-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: shivaai-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT_API_KEY: "qdrant_dev_key"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shivaai-network

  neo4j:
    image: neo4j:5-community
    container_name: shivaai-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/shivaai_dev_pass
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p shivaai_dev_pass \"RETURN 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shivaai-network

  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: shivaai-gateway
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql://shivaai:shivaai_dev_pass@postgresql:5432/shivaai_db"
      REDIS_URL: "redis://redis:6379"
      QDRANT_URL: "http://qdrant:6333"
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_AUTH: "neo4j/shivaai_dev_pass"
      JWT_SECRET: "dev-secret-key-change-in-prod"
      DATABASE_PATH: "/app/data/gateway.db"
      LLM_PROVIDER: "${LLM_PROVIDER:-local}"
      LLM_TIMEOUT_SECONDS: "45"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_API_BASE: "${OPENAI_API_BASE:-https://api.openai.com/v1}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4o-mini}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      LOG_LEVEL: "DEBUG"
      ENVIRONMENT: "development"
    depends_on:
      - postgresql
      - redis
      - qdrant
      - neo4j
    volumes:
      - ./services/gateway:/app
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shivaai-network

  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: shivaai-frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: "http://localhost:8000"
      VITE_WS_URL: "ws://localhost:8000"
    depends_on:
      - gateway
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - shivaai-network

  prometheus:
    image: prom/prometheus:latest
    container_name: shivaai-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - shivaai-network

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  neo4j_data:
  prometheus_data:

networks:
  shivaai-network:
    driver: bridge
